pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.java"
      run: ./mvnw.cmd -q spotless:apply
      stage_fixed: true
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: ./mvnw.cmd -q verify -DskipITs
